name: Emulator Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/example/sensevoiceasr/**'
      - '.github/workflows/emulator_test.yml'

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [34]
        arch: [x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096 -netdelay none -netspeed full
          disable-animations: true
          disable-linux-hw-acceleration: false
          script: |
            echo "=== Waiting for emulator to fully boot ==="
            adb wait-for-device
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
            sleep 10

            echo "=== Installing APK ==="
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            sleep 2

            echo "=== Granting permissions ==="
            adb shell pm grant com.example.sensevoiceasr android.permission.RECORD_AUDIO

            echo "=== Launching app ==="
            adb shell am start -n com.example.sensevoiceasr/.MainActivity
            sleep 15

            echo "=== Checking if app is running ==="
            APP_RUNNING=$(adb shell pidof com.example.sensevoiceasr)
            echo "App PID: $APP_RUNNING"

            echo "=== Capturing logcat ==="
            adb logcat -d -v time | grep -iE "(OnnxInference|AsrViewModel|ModelState|onnxruntime|sensevoice|FATAL|AndroidRuntime)" > logcat_filtered.txt
            cat logcat_filtered.txt

            echo "=== Full error logcat ==="
            adb logcat -d -v time '*:E' > logcat_errors.txt
            cat logcat_errors.txt

            echo "=== Checking for crash ==="
            if adb shell pidof com.example.sensevoiceasr; then
              echo "APP IS RUNNING - model loaded successfully"
            else
              echo "APP CRASHED - checking logs for cause"
              adb logcat -d -v time | grep -A 20 "FATAL\|AndroidRuntime" > crash_log.txt
              cat crash_log.txt
            fi

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs-api${{ matrix.api-level }}-${{ matrix.arch }}
          path: |
            logcat_filtered.txt
            logcat_errors.txt
            crash_log.txt
          retention-days: 7

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7